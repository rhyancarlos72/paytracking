packages:
  - "apps/*"
  - "packages/*"

# esbuild precisa do script de instalação (binário da plataforma); o pnpm 11 bloqueia os não aprovados
allowBuilds:
  esbuild: true

# Só instala versões publicadas há pelo menos 1 dia (padrão do pnpm 11; protege contra pacote comprometido recém-publicado)
minimumReleaseAge: 1440

# versões mínimas seguras de dependências indiretas (alertas de segurança: vite, postcss, esbuild, react-router)
overrides:
  vite: 6.4.6
  postcss: 8.5.32
  esbuild: 0.28.2
  react-router: 7.18.6
  glob: 14.0.3
  minimatch: 11.0.3
